<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pusat Pengembangan UAV</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>

        @font-face {
            font-family: 'Amuro';
            src: url('./fonts/Amuro%20Bold%20Italic.otf') format('opentype');
        }

        :root {
            --lg-bg-color: rgba(255,255,255,0.30);
            --lg-border: rgba(255,255,255,0.42);
            --text-black: #000000;
            --text-grey: #4a4a4a;
            --autacs-blue: #3666B6;
        }

        /* RESET */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Inter',sans-serif;
            color: var(--text-black);
            font-size: 16px;
            background-image: url("uav-ui-portrait.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        @media (orientation: landscape) {
            body {
                background-image: url("uav-ui-landscape.jpg");
            }
        }

        /* PAGE */
        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 36px 16px;
        }

        /* CARD */
        .card {
            width: 100%;
            max-width: 420px;
            border-radius: 22px;
            padding: 36px 22px 160px;
            position: relative;
            background: linear-gradient( 180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.12) );
            backdrop-filter: blur(22px) saturate(165%) brightness(1.1);
            -webkit-backdrop-filter: blur(22px) saturate(165%) brightness(1.1);
            border: 1px solid rgba(255,255,255,0.48);
            box-shadow: 0 30px 70px rgba(0,0,0,0.40), inset 0 1px 1px rgba(255,255,255,.70);
            overflow: hidden;
            animation: slideIn .3s ease;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 28px;
            color: var(--text-grey);
            line-height: 1.6;
        }

            .header h3 {
                font-size: 26px;
                margin: 10px 0 8px;
                color: var(--text-black);
            }

            .header .subtitle {
                font-size: 22px;
                color: var(--text-black);
            }

        .logo-circle {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            background: white;
        }

        .autacs {
            font-family: 'Amuro',sans-serif;
            color: var(--autacs-blue);
            letter-spacing: 2px;
            font-size: 28px;
        }

        /* VIDEO */
        .video-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .video {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            overflow: hidden;
            background: black;
            border: 2px solid rgba(0,0,0,0.25);
            box-shadow: 0 12px 30px rgba(0,0,0,0.30);
        }

            .video iframe {
                display: block;
                width: 100%;
                aspect-ratio: 16/9;
                border: none;
            }

        /* ===== PORTRAIT IMAGE STRIP ===== */
        .slider-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 15px 0 30px;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
        }

        /* Scrollbar Styling */
        .slider-wrapper::-webkit-scrollbar {
            height: 8px; 
        }

        .slider-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
        }

        .slider-wrapper::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.25); 
            border-radius: 10px;
        }

        .slider-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.45); 
        }

        /* PERBAIKAN DI SINI */
        .image-slider {
            display: flex;
            gap: 0px; 
            /* width: max-content; -> DIHAPUS agar tidak error layoutnya */
        }

            .image-slider img {
                flex: 0 0 100%; /* Memastikan gambar ambil lebar 100% dari container (1 layar hp) */
                width: 100%; 
                aspect-ratio: 8268 / 11811; /* Rasio asli gambar dipertahankan */
                height: auto; 
                
                scroll-snap-align: center;
                object-fit: fill; /* Menyambungkan gambar dengan sempurna */
                border-radius: 0px;
            }

        /* BUTTONS */
        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link {
            height: 54px;
            border-radius: 999px;
            background: var(--lg-bg-color);
            backdrop-filter: blur(12px) saturate(150%);
            border: 1px solid var(--lg-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: .25s ease;
            padding: 0 24px;
        }

            .link:hover {
                background: rgba(255,255,255,0.45);
                transform: translateY(-2px);
            }

            .link:active {
                transform: scale(.96);
            }

        /* ANIMASI */
        @keyframes slideIn {
            from {
                transform: translateX(30px);
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .slide-out {
            animation: slideOut .2s ease forwards;
        }

        @keyframes slideOut {
            to {
                transform: translateX(-30px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="card" id="card">

            <div class="header">
                <img src="./logo.jpg" class="logo-circle">
                <h3>Pusat Pengembangan UAV</h3>
                <p class="subtitle">
                    Powered by <span class="autacs">AUTACS</span>
                </p>
            </div>

            <div class="video-wrapper">
                <div class="video">
                    <iframe src="https://www.youtube.com/embed/CTheLyGWGMY" allowfullscreen></iframe>
                </div>
            </div>

            <div class="slider-wrapper">
                <div class="image-slider">
                    <img src="history0.jpg">
                    <img src="history1.jpg">
                    <img src="history2.jpg">
                    <img src="history3.jpg">
                    <img src="history4.jpg">
                    <img src="history5.jpg">
                    <img src="history6.jpg">
                </div>
            </div>

            <div class="links">
                <a class="link" href="menu-a.html" onclick="go(this.href);return false;">Katalog Produk</a>
                <a class="link" href="menu-b.html" onclick="go(this.href);return false;">Video Dokumentasi</a>
            </div>

        </div>
    </div>

    <script>
        function go(url) {
            const card = document.getElementById('card');
            card.classList.add('slide-out');
            setTimeout(() => location.href = url, 200);
        }
    </script>

</body>
</html>
